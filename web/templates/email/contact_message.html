<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        .email-container {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            max-width: 600px;
        }
        .email-header {
            background-color: #0073e6;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .email-header h1 {
            margin: 0;
        }
        .email-content {
            padding: 20px;
        }
        .email-content p {
            margin: 10px 0;
        }
        .email-footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #777;
        }
        .email-footer p {
            margin: 5px 0;
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            background-color: #0073e6;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin: 5px;
        }
        .btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h1>Contact Us Message</h1>
        </div>
        <div class="email-content">
            <p><strong>Full Name:</strong> {{ fullname }}</p>
            <p><strong>Email:</strong> {{ email }}</p>
            <p><strong>Company:</strong> {{ company }}</p>
            <p><strong>Message:</strong></p>
            <p>{{ text }}</p>
            <p><strong>Date and Time:</strong> {{ formatted_datetime }}</p>
            <div class="btn-container">
                <a href="mailto:{{ email }}" class="btn">Reply to {{ fullname }}</a>
            </div>
        </div>
        <div class="email-footer">
            <p>© {{ current_year }} Cyber Code</p>
            <p>All rights reserved.</p>
        </div>
    </div>
</body>
</html>
